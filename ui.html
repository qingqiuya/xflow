<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>XFlow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#232936;--fg:#e8ebf2;--dim:#8b93a7;
  --acc:#4cc2ff;--ok:#3ddc84;--bad:#ff6b6b;--warn:#ffc857;
}
body{font:13.5px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:14px 16px 10px;background:linear-gradient(180deg,#141821,#0b0d12);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.brand b{font-size:17px;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,#5cc9ff,#3ddc84);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:12px;color:var(--dim)}
.addrow{display:flex;gap:8px}
select{background:#0a0d12;border:1px solid var(--line);color:var(--fg);padding:10px 8px;border-radius:8px;font-size:13px;outline:none}
input{flex:1;background:#0a0d12;border:1px solid var(--line);color:var(--fg);padding:10px 12px;border-radius:8px;font-size:13.5px;outline:none;transition:.15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(76,194,255,.12)}
button{cursor:pointer;border:0;border-radius:8px;font-size:13.5px;font-weight:600;transition:.15s}
button:active{transform:scale(.97)}
.primary{background:linear-gradient(180deg,#5cc9ff,#37a9e6);color:#031018;padding:10px 18px}
.primary:hover{filter:brightness(1.08)}
.ghost{background:#1c2230;color:var(--fg);padding:9px 14px;font-weight:500}
.ghost:hover{background:#242c3d}
.danger{background:#3a1f24;color:#ff9a9a;padding:5px 11px;font-size:12.5px;font-weight:500}
.mini{background:#1c2230;color:var(--fg);padding:5px 11px;font-size:12.5px;font-weight:500}
.mini:hover{background:#242c3d}
.bar-top{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--dim)}
.bar-top .grow{flex:1}
.list{flex:1;overflow-y:auto;padding:12px 16px 18px}
.list::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb{background:#242b3a;border-radius:6px;border:2px solid var(--bg)}
.job{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;transition:.15s}
.job:hover{border-color:#2f394d}
.job .hd{display:flex;align-items:center;gap:9px}
.job .nm{font-weight:600;font-size:13.8px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:2.5px 9px;border-radius:99px;background:#232a38;color:var(--dim);white-space:nowrap}
.badge.dl{background:rgba(76,194,255,.14);color:var(--acc)}
.badge.done{background:rgba(61,220,132,.14);color:var(--ok)}
.badge.err{background:rgba(255,107,107,.14);color:var(--bad)}
.sub{display:flex;gap:10px;color:var(--dim);font-size:12.3px;margin-top:5px}
.pb{height:6px;background:#0a0d12;border-radius:5px;overflow:hidden;margin-top:9px}
.pb>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#2f8fff,#5cc9ff);width:0;transition:width .4s ease}
.pb.done>i{background:linear-gradient(90deg,#2fae6a,#3ddc84)}
.segs{display:flex;gap:3px;margin-top:6px;height:5px}
.segs *{flex:1;background:#0a0d12;border-radius:2px;overflow:hidden;position:relative;min-width:0}
.segs *>b{display:block;height:100%;background:linear-gradient(90deg,#2f8fff,#5cc9ff);width:0;transition:width .35s ease}
.segs.done *>b{background:linear-gradient(90deg,#2fae6a,#3ddc84)}
.acts{display:flex;gap:7px;margin-top:10px}
.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:13px}
.empty b{display:block;font-size:30px;margin-bottom:10px;opacity:.35}
.st{font-size:12.3px;color:var(--dim)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{width:560px;max-height:70vh;background:#141821;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg-hd{padding:14px 16px;font-weight:600;border-bottom:1px solid var(--line)}
.dlg-path{padding:10px 16px;color:var(--dim);font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#0f121a}
.dlg-q{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:#11141b}
.dlg-q button{background:#1c2230;color:var(--fg);padding:5px 11px;font-size:12.3px;border-radius:7px;font-weight:500}
.dlg-q button:hover{background:#242c3d}
.dlg-list{flex:1;overflow-y:auto;padding:8px}
.dlg-list::-webkit-scrollbar{width:9px}
.dlg-list::-webkit-scrollbar-thumb{background:#242b3a;border-radius:6px}
.drow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13.5px}
.drow:hover{background:#1d2330}
.drow .ico{opacity:.7}
.dlg-ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.dlg-ft .grow{flex:1}
</style></head>
<body>
<div class="top">
  <div class="brand"><b>XFlow</b><span>潮汐流动 · 把文件带下来</span></div>
  <div class="addrow">
    <input id="url" placeholder="粘贴下载链接：http/https 直链 或 magnet:?xt=...">
    <input id="name" placeholder="文件名（可留空）" style="flex:0 0 150px">
    <select id="segs" title="并发连接数">
      <option value="4">4 连接</option>
      <option value="8">8 连接</option>
      <option value="16" selected>16 连接</option>
      <option value="32">32 连接</option>
      <option value="48">48 连接</option>
    </select>
    <button class="primary" id="add">开始下载</button>
  </div>
  <div class="bar-top">
    <span id="stat">就绪</span>
    <span class="grow"></span>
    <input type="file" id="torrentFile" hidden>
    <button class="ghost" id="torrentBtn" title="选一个 .torrent 文件加任务">种子文件</button>
    <button class="ghost" id="dir">下载目录</button>
    <button class="ghost" id="clear">清空已完成</button>
    <button class="ghost" id="hide">隐藏到托盘</button>
  </div>
</div>
<div class="mask" id="mask"><div class="dlg">
  <div class="dlg-hd">选择下载目录</div>
  <div class="dlg-path" id="dlgPath">此电脑</div>
  <div class="dlg-q" id="dlgQuick"></div>
  <div class="dlg-list" id="dlgList"></div>
  <div class="dlg-ft"><button class="ghost" id="dlgUp">上一级</button><span class="grow"></span>
  <button class="ghost" id="dlgCancel">取消</button><button class="primary" id="dlgOk">用这个目录</button></div>
</div></div>
<div class="list" id="list"><div class="empty"><b>⬇</b>还没有任务</div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fs(n){if(!n||isNaN(n)||n<=0)return '—';const u=['B','KB','MB','GB','TB'];let i=0;n=+n;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+u[i]}
const badge=s=>({downloading:['dl','下载中'],queued:['dl','排队'],paused:['','已暂停'],done:['done','已完成'],error:['err','出错']}[s]||['',s]);
let dirShown='';
async function load(){
  const d=await (await fetch('/api/jobs')).json();
  const js=d.jobs||[];
  const st=js.filter(j=>j.state==='downloading').length;
  $('#stat').textContent=`共 ${js.length} 个任务`+(st?` · ${st} 个下载中`:'')+(dirShown?` · ${dirShown}`:'');
  if(!js.length){$('#list').innerHTML='<div class="empty"><b>⬇</b>还没有任务，贴个链接开始吧</div>';return}
  $('#list').innerHTML=js.map(j=>{
    const pct=j.total>0?Math.min(100,j.done/j.total*100):0;
    const [bc,bt]=badge(j.state);
    const rate=j.state==='downloading'&&j.rate>0?fs(j.rate)+'/s':'';
    return `<div class="job">
      <div class="hd"><div class="nm" title="${esc(j.source)}">${esc(j.name||j.source)}</div><span class="badge ${bc}">${bt}</span></div>
      <div class="sub"><span>${fs(j.done)} / ${fs(j.total)}</span>${j.workers?`<span>${j.workers} 连接</span>`:''}${pct?`<span>${pct.toFixed(1)}%</span>`:''}${rate?`<span style="color:var(--acc)">${rate}</span>`:''}${j.err?`<span style="color:var(--bad)">${esc(j.err)}</span>`:''}</div>
      <div class="pb ${j.state==='done'?'done':''}"><i style="width:${pct.toFixed(1)}%"></i></div>
      ${(j.segments&&j.segments.length)?`<div class="segs ${j.state==='done'?'done':''}">${j.segments.map(s=>{const tot=s.to-s.from+1;const d=Math.min(100,s.done/tot*100);return `<span><b style="width:${d.toFixed(0)}%"></b></span>`}).join('')}</div>`:''}
      <div class="acts">
        ${j.state==='downloading'?`<button class="mini" data-id="${j.id}" data-act="pause">暂停</button>`:''}
        ${(j.state==='paused'||j.state==='queued')?`<button class="mini" data-id="${j.id}" data-act="resume">继续</button>`:''}
        ${(j.state==='done'||j.state==='error')?`<button class="mini" data-id="${j.id}" data-act="redownload">重新下载</button>`:''}
        <button class="mini" data-id="${j.id}" data-act="open">打开位置</button>
        <button class="danger" data-id="${j.id}" data-act="remove">删除</button>
      </div></div>`;
  }).join('');
}
$('#list').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const {id,act}=b.dataset;
  if(act==='remove') await fetch('/api/job/'+id,{method:'DELETE'});
  else if(act==='open') await fetch('/api/open?id='+id);
  else if(act==='redownload') await fetch('/api/redownload?id='+id);
  else await fetch('/api/job/'+id+'/'+act,{method:'POST'});
  load();
});
$('#add').onclick=async()=>{
  const src=$('#url').value.trim();
  if(!src){$('#url').focus();return}
  $('#add').disabled=true;
  await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({source:src,name:$('#name').value.trim(),segs:parseInt($('#segs').value)||16})});
  $('#url').value='';$('#name').value='';$('#add').disabled=false;load();
};
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')$('#add').click()});
$('#torrentBtn').onclick=()=>$('#torrentFile').click();
$('#torrentFile').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const fd=new FormData();
  fd.append('file',f);
  const r=await (await fetch('/api/torrent',{method:'POST',body:fd})).json();
  e.target.value='';
  if(!r.ok){alert(r.err||'加不上这个种子');return}
  load();
};
// 拖一个 .torrent 到窗口里也认
document.addEventListener('dragover',e=>{e.preventDefault()});
document.addEventListener('drop',async e=>{
  e.preventDefault();
  const f=e.dataTransfer.files&&e.dataTransfer.files[0];
  if(!f)return; // 不看后缀，服务端会解析内容，不是种子会退回来
  const fd=new FormData();
  fd.append('file',f);
  const r=await (await fetch('/api/torrent',{method:'POST',body:fd})).json();
  if(!r.ok){alert(r.err||'加不上这个种子');return}
  load();
});
let browsePath='';
function esc2(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function browse(path){
  const r=await (await fetch('/api/browse?path='+encodeURIComponent(path))).json();
  if(!r.ok){alert(r.err||'打不开这个目录');return}
  browsePath=r.path;
  $('#dlgPath').textContent=r.path||'此电脑';
  const q=r.shortcuts||{};
  $('#dlgQuick').innerHTML=Object.keys(q).length?Object.keys(q).map(k=>`<button data-q="${esc2(q[k])}">${esc2(k)}</button>`).join(''):'';
  const rows=(r.dirs||[]).map(d=>`<div class="drow" data-p="${esc2(d.path)}"><span class="ico">📁</span><span>${esc2(d.name)}</span></div>`).join('');
  $('#dlgList').innerHTML=rows||'<div class="drow" style="cursor:default;color:#8b93a7">（没有子文件夹）</div>';
  $('#dlgUp').dataset.parent=r.parent||'';
}
$('#dir').onclick=async()=>{ $('#mask').classList.add('on'); browse(''); };
$('#dlgCancel').onclick=()=>$('#mask').classList.remove('on');
$('#dlgUp').onclick=async()=>{ const p=$('#dlgUp').dataset.parent; if(p!==undefined) browse(p); };
$('#dlgList').onclick=e=>{ const d=e.target.closest('.drow[data-p]'); if(d) browse(d.dataset.p); };
$('#dlgQuick').onclick=e=>{ const b=e.target.closest('button[data-q]'); if(b) browse(b.dataset.q); };
$('#dlgOk').onclick=async()=>{
  if(!browsePath){ alert('先选一个目录'); return; }
  const r=await (await fetch('/api/setdir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir:browsePath})})).json();
  if(r.ok){ dirShown=browsePath; $('#mask').classList.remove('on'); load(); }
};
$('#clear').onclick=async()=>{await fetch('/api/clear');load()};
$('#hide').onclick=async()=>{await fetch('/api/hide');};
const savedSegs=localStorage.getItem('xflow_segs');
if(savedSegs){const o=document.querySelector(`#segs option[value="${savedSegs}"]`); if(o)o.selected=true;}
$('#segs').onchange=()=>localStorage.setItem('xflow_segs',$('#segs').value);
load();setInterval(load,1000);
</script></body></html>
