<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #16181d;
    --card: #1e2128;
    --line: #2a2e36;
    --fg: #e8ecf2;
    --dim: #8b93a7;
    --acc: #4cc2ff;
    --ok: #3ddc84;
    --warn: #f0a020;
    --err: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    width: 300px; margin: 0;
    font: 13px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部：品牌 + 连接状态 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-size: 15px; font-weight: 700; letter-spacing: .5px;
    background: linear-gradient(90deg, #5cc9ff, #3ddc84);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--dim);
    padding: 3px 9px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--line);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px rgba(61,220,132,.6); }
  .dot.off { background: var(--err); }
  .dot.pause { background: var(--warn); box-shadow: 0 0 6px rgba(240,160,32,.5); }

  /* 主体卡片 */
  .body { padding: 12px 14px 14px; }

  .switch-card {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 10px;
  }
  .switch-card .t { font-size: 13.5px; font-weight: 600; }
  .switch-card .s { font-size: 11px; color: var(--dim); margin-top: 1px; }

  .sw { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer; border-radius: 24px;
    background: #3a3f49; transition: .18s;
  }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .18s;
  }
  .sw input:checked + .slider { background: var(--acc); }
  .sw input:checked + .slider::before { transform: translateX(18px); }

  /* 暂停区 */
  .pause-block { margin-bottom: 10px; }
  .pause-block .label {
    font-size: 11px; color: var(--dim); margin: 0 0 6px 2px; letter-spacing: .3px;
  }
  .pause-btns { display: flex; gap: 6px; }
  .pause-btns button {
    flex: 1; padding: 8px 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    font-size: 12px; transition: .15s;
  }
  .pause-btns button:hover { border-color: var(--acc); color: var(--acc); }
  .pause-btns button.active {
    border-color: var(--warn); color: var(--warn); background: rgba(240,160,32,.1);
  }

  /* 高级设置折叠 */
  details {
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); overflow: hidden;
  }
  summary {
    cursor: pointer; padding: 10px 13px; font-size: 12px; color: var(--dim);
    list-style: none; user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "›"; float: right; transition: .15s; }
  details[open] summary::after { transform: rotate(90deg); }
  details[open] summary { border-bottom: 1px solid var(--line); }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 13px; font-size: 12px;
  }
  .row + .row { border-top: 1px solid rgba(42,46,54,.6); }
  .row label { color: var(--dim); }
  .row input[type="number"] {
    width: 72px; padding: 4px 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font-size: 12px; text-align: right;
  }
  .row input[type="number"]:focus { outline: none; border-color: var(--acc); }

  .hint {
    font-size: 10.5px; color: #6b7280; line-height: 1.7;
    margin: 10px 2px 0;
  }
  .hint b { color: #8b93a7; font-weight: 500; }
</style>
</head>
<body>
  <header>
    <div class="brand">汐流 XFlow</div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">检测中</span></div>
  </header>

  <div class="body">
    <div class="switch-card">
      <div>
        <div class="t">接管浏览器下载</div>
        <div class="s" id="substate">下载直接交给汐流</div>
      </div>
      <span class="sw"><input type="checkbox" id="enabled"><span class="slider"></span></span>
    </div>

    <div class="pause-block">
      <div class="label">暂停接管</div>
      <div class="pause-btns">
        <button data-min="5">5 分</button>
        <button data-min="30">30 分</button>
        <button data-min="60">1 小时</button>
        <button id="pauseForever">长期</button>
      </div>
    </div>

    <details>
      <summary>更多设置</summary>
      <div class="row">
        <label for="notify">转发后弹提示</label>
        <span class="sw"><input type="checkbox" id="notify"><span class="slider"></span></span>
      </div>
      <div class="row">
        <label for="port">XFlow 端口</label>
        <input type="number" id="port" min="1" max="65535">
      </div>
      <div class="row">
        <label for="minMB">小于此值不接管（MB）</label>
        <input type="number" id="minMB" min="0" max="10240" step="0.5">
      </div>
    </details>

    <p class="hint">
      <b>blob:</b> / <b>data:</b> / 表单提交 / 整页另存 —— 这几类浏览器不给可复用地址，插件接不了，会照常由浏览器下载。<br>
      汐流没开的时候下载会自己交回浏览器，不会把文件弄丢。
    </p>
  </div>

<script src="popup.js"></script>
</body>
</html>
